<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#1b2a7a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Idle Trader">
<meta name="description" content="Idle Trader — a colorful tycoon game. Trade, upgrade your office, collect cars, homes and businesses.">
<title>Idle Trader</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="fonts/fonts.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app" id="app">
  <header class="hud" id="hud">
    <div class="hud-avatar-wrap"><button class="hud-avatar" id="hudAvatar" aria-label="Open profile"></button><span class="lv-badge" id="lvBadge">1</span></div>
    <div class="hud-center">
      <div class="hud-cash-row"><div class="hud-cash" id="cash">$0</div><button class="hud-plus" id="shopBtn" aria-label="Open shop">+</button></div>
      <div class="hud-sub"><span class="good" id="income">+$0/sec</span><span class="boost-chip" id="boostChip" hidden>2×</span><span class="dot">·</span><span class="hud-lv">Level <b id="hudLevel">1</b></span><span class="hud-xp" id="hudXp">0 / 80 XP</span></div>
      <div class="xp-bar" aria-hidden="true"><i id="xpFill"></i></div>
    </div>
    <div class="hud-right">
      <div class="hud-rank" id="rank">Aspiring Trader</div>
      <div class="hud-save" id="saveStatus">● Saved</div>
    </div>
  </header>
  <main class="scenes" id="scenes"></main>
  <button class="gift" id="gift" hidden aria-label="Free cash — watch an ad"><span class="gift-ic">🎁</span><span class="gift-txt"><small>FREE CASH · AD</small><b>+$25</b></span></button>
  <nav class="nav" id="nav" aria-label="Game sections"></nav>
  <div class="banner" id="banner" hidden aria-label="Advertisement"></div>
</div>
<div class="fx-layer" id="fx" aria-hidden="true"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<noscript><p style="color:#fff;padding:20px;font-family:sans-serif">Idle Trader needs JavaScript to run.</p></noscript>
<script src="firebase-config.js"></script>
<script src="native.js"></script>
<script type="module" src="app.js"></script>
</body>
</html>
